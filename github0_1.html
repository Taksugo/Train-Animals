function tSpawn(t,k,bi){if(state!='play'){tm='Entrá primero a un nivel (IR)';return}
 if(t=='B'){en.push(mkE('B',(WW-8)*T,7.5*T,bi));tm='Jefe: '+BOSS[bi].n;return}
 const c=W.floor.filter(a=>{const d=Math.hypot(a[0]*T+8-P.x,a[1]*T+8-P.y);return d>45&&d<130});
 for(let i=0;i<k;i++){const f=c.length?c[Math.random()*c.length|0]:null;en.push(mkE(t,f?f[0]*T+8:P.x+60,f?f[1]*T+8:P.y))}tm='Spawneado: '+t+' x'+k}
function tAct(a){
 if(a=='abil'){tm='';tWin('a')}else if(a=='enem'){tm='';tWin('e')}else if(a=='tx')lt.style.display='none';
 else if(a=='qty'){TQ=TQ==1?3:TQ==3?5:1;tWin('e')}
 else if(a[0]=='b'&&a.length==2){tSpawn('B',1,+a[1]);if(lt.style.display=='block')tWin('e')}
 else if(a=='killall'){en.forEach(e=>e.hp=0)}else if(a=='heal'){P.hp=P.mh;P.shd=Math.max(P.shd||0,P.shm||0)}
 else if(a=='c100')coins+=100;else if(a=='c500')coins+=500;
 else if(a=='ph2'){en.filter(e=>e.boss).forEach(e=>e.hp=Math.min(e.hp,e.mh*.49))}
 else if(a=='dmg'){if(window._td===P){P.dmg/=10;window._td=null}else{P.dmg*=10;window._td=P}}
 else if(a=='mis'){MS.a=Object.assign(mkMission(Math.random,n),{dl:n+10});MS.st=0;$('ln').textContent=lsel}
 else if(a=='misok'){if(MS.a)MS.a.p=MS.a.g}
 else if(a[0]=='m'&&a.length==2){if(a=='mx')musStop();else{musStart(+a[1],1);tm=''}}}

 const go=()=>{NET.code=netCode();const pr=new Peer('utren-'+NET.code);pr.on('open',()=>{NET.peer=pr;netErr('');netShowLobby();netLobbyBc()});pr.on('error',e=>{if(e.type=='unavailable-id')go();else netErr('Error de red: '+e.type)});pr.on('connection',c=>{const s=()=>{c.on('data',m=>netHostMsg(c,m));c.on('close',()=>netDrop(c));c.on('error',()=>netDrop(c))};s()})};go()}
function netDrop(c){const i=RPS.findIndex(r=>r.c===c);if(i<0)return;RPS.splice(i,1);netLobbyBc();if(NET.started)say('Un jugador salió de la sala',2.5)}
function netHostMsg(c,m){const q=c._q;
 if(m.t=='hi'){if(q)return;if(RPS.length>=3){c.send({t:'full'});setTimeout(()=>c.close(),400);return}
  const used=new Set([NET.skin,...RPS.map(r=>r.skin)]);let sk=+m.skin|0;if(used.has(sk)||sk<0||sk>3)sk=[0,1,2,3].find(i=>!used.has(i));
  const id=++NET.nid,r={...PS(),rid:id,c,name:String(m.name||'Jugador').slice(0,12),skin:sk,x:2.5*T,y:7.5*T,hp:100,mh:100,fx:1,fy:0,an:0,sw:0,sc:0,inv:0,dead:0,fcd:0};c._q=r;RPS.push(r);
  c.send({t:'welcome',id,skin:sk,code:NET.code});netLobbyBc();if(NET.started)c.send({t:'start',run:NET.run,rs:runSeed,n});return}
 if(!q)return;
 if(m.t=='s'){if(isFinite(m.x+m.y)){q.x=m.x;q.y=m.y;q.fx=m.fx;q.fy=m.fy;q.an=m.an;q.sw=m.sw;q.sc=m.sc}}
 else if(m.t=='st'){const om=q.mh;Object.assign(q,m.st);if(q.mh>om)q.hp+=q.mh-om}
 else if(m.t=='f'){if(q.dead||state!='play'||q.fcd>0||!isFinite(m.ax+m.ay))return;q.fcd=Math.max(.05,(q.rate||.34)*.7);const H=P;P=q;try{_fire(m.ax,m.ay)}finally{P=H}}
 else if(m.t=='buy'){const it=W.shop&&W.shop[m.i];if(it&&!it.sold&&coins>=it.pr){coins-=it.pr;it.sold=1;c.send({t:'bought',i:m.i,id:it.id,ok:1})}else c.send({t:'bought',i:m.i,ok:0})}}
// ---------- cliente ----------
function netJoin(code){if(!window.Peer){netErr('No se pudo cargar PeerJS (¿sin internet?).');return}if(code.length<4){netErr('Poné el código de la sala');return}netProfile();netErr('Conectando…');
 const pr=new Peer();NET.peer=pr;let to=setTimeout(()=>netErr('No se encontró la sala. Revisá el código/link.'),10000);
 pr.on('error',e=>{clearTimeout(to);netErr(e.type=='peer-unavailable'?'Esa sala no existe o ya se cerró.':'Error de red: '+e.type)});
 pr.on('open',()=>{const c=pr.connect('utren-'+code,{reliable:true,serialization:'json'});NET.conn=c;
  c.on('open',()=>{clearTimeout(to);c.send({t:'hi',name:NET.name,skin:NET.skin})});c.on('data',netClientMsg);
  c.on('close',()=>{if(NET.on){$('ov').style.display='flex';$('ov').querySelector('h1').textContent='SALA CERRADA';$('ov').querySelector('p').textContent='Se perdió la conexión con el anfitrión.';$('go').textContent='VOLVER AL MENÚ';$('go').onclick=()=>{location.href=location.href.split('?')[0]};state='dead'}})})}
function netClientMsg(m){
 if(m.t=='welcome'){NET.on=true;NET.host=false;NET.id=m.id;NET.skin=m.skin;NET.code=m.code;netErr('');netShowLobby()}
 else if(m.t=='full')netErr('La sala está llena (máximo 4 jugadores).');
 else if(m.t=='lobby')netLobbyUI(m.l);
 else if(m.t=='start')netStartC(m);
 else if(m.t=='sn')netApply(m);
 else if(m.t=='got'){if(m.u!=null){UP[m.u].f(P);say('MEJORA: '+UP[m.u].n,2.5);showPic(UP[m.u].ic,UP[m.u].c,2.5);snd(880,.3,'triangle',.08)}else snd(660,.15,'triangle',.07)}
 else if(m.t=='bought'){const it=W.shop&&W.shop[m.i];if(m.ok&&it){ITEMS[m.id].f(P);P.own=P.own||{};P.own[m.id]=1;it.sold=1;snd(880,.12,'triangle',.08);snd(1320,.2,'triangle',.06);say('Compraste: '+ITEMS[m.id].n,2.5);showPic(ITEMS[m.id].ic,'#ffd040',3);blood(it.x,it.y,14,'#ffd040')}else if(it){it.sold=0;it.t=0}}}
function netStartC(m){NETC=true;NET.started=true;NET.run=m.run;runSeed=m.rs;seen=1;P={...PS(),x:0,y:0,hp:100,mh:100,fx:1,fy:0,cd:0,sw:0,inv:0,an:0,sx:1,sy:0,dead:0};NET.me=P;kills=0;coins=0;['lb','mm','ov','lv'].forEach(i=>$(i).style.display='none');$('mpl').style.display='block';startAmb();paused=false;fade=0;nextN=0;NET.prev=new Map();load(m.n);state='play'}
function netApply(m){if(!NETC||!NET.started||!W)return;
 if(m.rs!==runSeed||m.n!==n){runSeed=m.rs;load(m.n)}
 state=m.st;fade=m.fd;nextN=m.nx;if(m.k!==kills){kills=m.k;$('kl').textContent='☠ '+kills}coins=m.c;
 if(m.st=='dead'){$('ov').style.display='flex';$('ov').querySelector('h1').textContent='FIN DEL VIAJE';$('ov').querySelector('p').textContent='Todo el equipo cayó en el vagón '+m.n+'. Esperando al anfitrión…';$('go').style.display='none'}else{$('ov').style.display='none';$('go').style.display=''}
 const old=NET.prev,nw=new Map();for(const e of m.en){const o=old.get(e.nid);if(o){if(e.hp<o.hp-.01){dmgNum(e.x,e.y-10,o.hp-e.hp);blood(e.x,e.y,3,e.t=='s'?'#5aa030':'#a01820')}if(Math.hypot(e.x-o.x,e.y-o.y)<70){e._x=e.x;e._y=e.y;e.x=o.x;e.y=o.y}}nw.set(e.nid,e)}
 for(const[id,o]of old)if(!nw.has(id)){blood(o.x,o.y,14,'#a01820');snd(90,.2,'sawtooth',.07)}
 NET.prev=nw;en=m.en;pr=m.pr.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],l:a[4],d:a[5],c:a[6]||undefined}));sh=m.sh.map(a=>({x:a[0],y:a[1],vx:a[2],vy:a[3],l:a[4],d:a[5],pc:0,h:[]}));pk=m.pk;cn=m.cn;hz=m.hz;npc=m.np||null;
 if(m.shop&&W.shop){m.shop.forEach((s,i)=>{if(W.shop[i]){W.shop[i].sold=s.sold;W.shop[i].id=s.id}})}
 if(m.fb)Object.assign(FB,m.fb);if(m.sk>shk)shk=m.sk;
 if(m.ms&&m.ms!==NET.lms){say(m.ms,2.5)}NET.lms=m.ms||'';
 NET.pl=m.pl;const mine=m.pl.find(p=>p.id===NET.id);if(mine){P.hp=mine.hp;P.dead=mine.dead;P.inv=mine.inv;if(mine.pu&&!P.dead)mv(P,mine.pu[0],mine.pu[1])}}
function netSmooth(dt){for(const e of en){if(e._x!=null){const k=Math.min(1,dt*20);e.x+=(e._x-e.x)*k;e.y+=(e._y-e.y)*k}e.fl-=dt;if(e.mt!=null)e.mt-=dt;if(e.vul>0)e.vul-=dt}
 for(const c of cn){c.t+=dt;c.x+=c.vx*dt;c.y+=c.vy*dt;c.vx*=.9;c.vy*=.9}for(const h of hz){h.w-=dt;h.l-=dt}
 if(W&&W.bi==4){for(const w of FB.wv){if(w.w>0)w.w-=dt;else w.r+=105*dt}for(const p of FB.pl){if(p.w>0)p.w-=dt;else p.l-=dt}for(const r of FB.rk)r.t+=dt;if(FB.gh)FB.gh.dd+=dt/3.4;if(FB.ban)FB.ban.t+=dt;FB.fl=Math.max(0,FB.fl-dt*2)}}
// ---------- bucle de red ----------
function netTick(dt){if(!NET.on||!NET.started)return;NET.acc+=dt;
 for(const o of netOthers()){const d=NET.disp[o.id]||(NET.disp[o.id]={x:o.p.x,y:o.p.y}),k=Math.min(1,dt*14);d.x+=(o.p.x-d.x)*k;d.y+=(o.p.y-d.y)*k}
 if(NETC){if(NET.acc>=.05){NET.acc=0;netSend({t:'s',x:nrd(P.x),y:nrd(P.y),fx:nrd(P.fx),fy:nrd(P.fy),an:nrd(P.an),sw:nrd(P.sw),sc:nrd(P.sc)})}NET.lt+=dt;if(NET.lt>1){NET.lt=0;netSend({t:'st',st:netStats(P)})}netSmooth(dt)}
 else if(NET.host&&RPS.length&&NET.acc>=.066){NET.acc=0;netBc(netSnap())}
 NET.ui-=dt;if(NET.ui<=0){NET.ui=.3;const a=[{nm:NET.name,sk:NET.skin,hp:P.hp,mh:P.mh,d:P.dead}];for(const o of netOthers())a.push({nm:o.nm,sk:o.sk,hp:o.p.hp,mh:o.p.mh,d:o.p.dead});$('mpl').innerHTML=a.map(p=>'<div style="color:'+(p.d?'#888':'#fff')+'">'+(p.d?'☠':'♥')+' '+p.nm.replace(/</g,'&lt;')+' '+Math.max(0,Math.round(p.hp/p.mh*100)||0)+'%</div>').join('')}}
function netSnap(){const me=NET.me||P,pl=[{id:0,x:nrd(me.x),y:nrd(me.y),fx:nrd(me.fx),fy:nrd(me.fy),an:nrd(me.an),sw:nrd(me.sw),sc:nrd(me.sc),hp:nrd(me.hp),mh:me.mh,inv:nrd(me.inv),dead:me.dead?1:0,nm:NET.name,sk:NET.skin}];
 for(const q of RPS){pl.push({id:q.rid,x:nrd(q.x),y:nrd(q.y),fx:q.fx,fy:q.fy,an:q.an,sw:q.sw,sc:q.sc,hp:nrd(q.hp),mh:q.mh,inv:nrd(q.inv),dead:q.dead?1:0,nm:q.name,sk:q.skin,pu:q.pu});q.pu=null}
 const s={t:'sn',rs:runSeed,n,st:state,fd:nrd(fade),nx:nextN,k:kills,c:coins,en:en.map(e=>{if(!e.nid)e.nid=++NET.eid;return nprim(e)}),pr:pr.map(p=>[nrd(p.x),nrd(p.y),nrd(p.vx),nrd(p.vy),nrd(p.l),nrd(p.d),p.c||0]),sh:sh.map(p=>[nrd(p.x),nrd(p.y),nrd(p.vx),nrd(p.vy),nrd(p.l),nrd(p.d)]),pk:pk.map(nprim),cn:cn.map(nprim),hz:hz.map(nprim),np:npc&&!npc.gone?nprim(npc):null,pl,sk:Math.round(shk),ms:msgT>0?$('msg').textContent:''};
 if(W.shop)s.shop=W.shop.map(i=>({id:i.id,sold:i.sold?1:0}));
 if(W.bi==4)s.fb={bm:FB.bm,rk:FB.rk.map(nprim),pl:FB.pl.map(nprim),wv:FB.wv.map(nprim),gh:FB.gh?nprim(FB.gh):null,dark:nrd(FB.dark),ban:FB.ban,fl:nrd(FB.fl)};
 return s}
// ---------- lógica del anfitrión con jugadores remotos ----------
function netPick(e,H){if(!RPS.length)return H;let b=H.dead?null:H,bd=b?Math.hypot(H.x-e.x,H.y-e.y):1e9;for(const q of RPS){if(q.dead)continue;const d=Math.hypot(q.x-e.x,q.y-e.y);if(d<bd){bd=d;b=q}}if(b&&b.rid&&b._x0==null){b._x0=b.x;b._y0=b.y}return b||H}
function netHit(q,d){const H=P;P=q;try{hurtP(d)}finally{P=H}}
function prHitR(p){for(const q of RPS){if(!q.dead&&Math.hypot(p.x-q.x,p.y-q.y)<7){netHit(q,p.d);return true}}return false}
function netRd(H){return RPS.some(q=>!q.dead&&q.x>(WW-1)*T-4)}
function netChk(){const me=NET.me||P;if(me.dead&&RPS.every(q=>q.dead)&&state=='play'){state='dead';$('ov').style.display='flex';$('ov').querySelector('h1').textContent='FIN DEL VIAJE';$('ov').querySelector('p').textContent='Todo el equipo cayó en el vagón '+n+' con '+kills+' enemigos derrotados.';$('go').textContent='REINTENTAR'}}
function netPost(dt){if(!RPS.length)return;
 for(const q of RPS){q.inv-=dt;q.fcd-=dt;if(q._x0!=null){if(q.x!==q._x0||q.y!==q._y0){q.pu=[(q.pu?q.pu[0]:0)+q.x-q._x0,(q.pu?q.pu[1]:0)+q.y-q._y0]}q._x0=null}
  if(q.dead)continue;if(q.reg)q.hp=Math.min(q.mh,q.hp+q.reg*dt);if(W.shop)q.hp=Math.min(q.mh,q.hp+3*dt);
  for(let i=pk.length-1;i>=0;i--){const p=pk[i];if(Math.hypot(p.x-q.x,p.y-q.y)<10&&!(p.b&&q.hp>=q.mh)){if(p.u!=null)q.c.send({t:'got',u:p.u});else{q.hp=Math.min(q.mh,q.hp+(p.b?10:25));q.c.send({t:'got'})}pk.splice(i,1)}}
  for(let i=cn.length-1;i>=0;i--){const c=cn[i];if(c.t>.2&&Math.hypot(q.x-c.x,q.y-c.y)<9){coins+=Math.max(1,Math.round(c.v*(q.cm||1)));cn.splice(i,1);snd(1100,.05,'square',.03)}}
  if(!q.hzt)q.hzt=new WeakMap();for(const h of hz)if(h.w<=0&&Math.hypot(q.x-h.x,q.y-h.y)<h.r){const t=(q.hzt.get(h)||0)-dt;if(t<=0){netHit(q,h.d);q.hzt.set(h,.6)}else q.hzt.set(h,t)}}
 if(W.bi==4){const b=en.find(z=>z.boss&&z.bi==4);for(const q of RPS){if(q.dead)continue;
  for(const w of FB.wv){if(w.w>0)continue;if(Math.abs(Math.hypot(q.x-w.x,q.y-w.y)-w.r)<5){let a=Math.atan2(q.y-w.y,q.x-w.x)-w.g;a=Math.atan2(Math.sin(a),Math.cos(a));if(Math.abs(a)>.5)netHit(q,w.d)}}
  for(const p of FB.pl){if(p.w>0)continue;if(Math.hypot(q.x-p.x,q.y-p.y)<p.r){q.pt=(q.pt||0)-dt;if(q.pt<=0){netHit(q,p.d);q.pt=.5}}}
  if(b)for(const a of FB.bm){const vx=q.x-b.x,vy=q.y-(b.y-12),c=Math.cos(a),s=Math.sin(a);if(vx*c+vy*s>0&&Math.abs(-vx*s+vy*c)<5)netHit(q,b.d*1.1)}}}
 netChk()}
function netReviv(){if(!NET.host)return;const me=NET.me||P;if(me.dead){me.dead=0;me.hp=Math.max(1,me.mh*.5)}for(const q of RPS){q.x=2.5*T;q.y=7.5*T;if(q.dead){q.dead=0;q.hp=q.mh*.5}}}
function netNewRun(){NET.me=P;if(!NET.host)return;NET.run++;for(const q of RPS)Object.assign(q,PS(),{hp:100,mh:100,dead:0,own:null,x:2.5*T,y:7.5*T});if(NET.started)netBc({t:'start',run:NET.run,rs:runSeed,n})}
function netBuy(it){const i=W.shop.indexOf(it);it.sold=1;netSend({t:'buy',i})}
function netCU(dt){shopU(dt);const t=coins+(P.shd>0?'  🛡'+P.shd:'');if(window._ct!==t){window._ct=t;$('co').textContent='🪙 '+t}}
// ---------- envoltorios ----------
const _fire=fire;fire=function(ax,ay){if(NETC){P.nf=(P.nf||0)+1;netSend({t:'f',ax:nrd(ax),ay:nrd(ay)});snd(520,.05,'triangle',.03);return}_fire(ax,ay)};
const _hP=hurtP;hurtP=function(d){if(NETC)return;
 if(P.rid){if(NT2){npcHurt(d);return}if(window.GOD||P.inv>0||P.dead||state!='play')return;P.hp-=d*(P.arm||1);P.inv=.7+(P.invx||0);blood(P.x,P.y,8);if(P.hp<=0){P.hp=0;P.dead=1;netChk()}return}
 if(P.dead)return;const me=NET.me||P;
 if(NET.host&&P===me&&RPS.some(q=>!q.dead)&&!NT2&&!window.GOD&&P.inv<=0&&state=='play'&&!(P.shd>0)&&P.hp-d*(P.arm||1)<=0){P.hp=0;P.dead=1;P.inv=.7;shk=6;blood(P.x,P.y,12);snd(110,.3,'sawtooth',.1);say('Caíste… ¡tus compañeros siguen! Te revivís en el próximo vagón',3.5);return}
 _hP(d)};
const _nr=newRun;newRun=function(){if(NET.on)seen=1;_nr();netNewRun()};
const _gl=goLv;goLv=function(k){_gl(k);netNewRun()};
const _ld=load;load=function(k){_ld(k);netReviv()};

let last=performance.now();function loop(t){const dt=Math.min(.05,(t-last)/1000);last=t;try{netTick(dt);if(W){update(dt);draw();if(state=='intro')drawIntro();cin(state=='intro')}}catch(err){console.error('Error de frame',err);try{cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.globalCompositeOperation='source-over'}catch(_){}}requestAnimationFrame(loop)}
P={x:0,y:0,hp:100,mh:100,fx:1,fy:0,cd:0,sw:0,inv:0,an:0,sx:1,sy:0};load(1);state='menu';requestAnimationFrame(loop);
</script></body></html>
